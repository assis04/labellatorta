# nginx do site estático da La Bella Torta (imagem nginxinc/nginx-unprivileged, uid 101).
#
# A produção oficial é o GitHub Pages, que não permite headers HTTP. Na auto-hospedagem estes headers
# complementam a CSP que o Astro injeta via <meta> em cada página. Duas CSPs valem ao mesmo tempo
# (o navegador exige as duas), então o header NÃO repete script-src/style-src: os hashes mudam a cada
# build e só a meta os conhece. Ele traz o que a meta não consegue expressar (frame-ancestors) e
# diretivas idênticas às da meta (object-src, base-uri, form-action).
#
# Sistema de arquivos somente leitura; escrita apenas em /tmp (tmpfs no docker-compose.yml).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json
                application/manifest+json application/xml image/svg+xml;

  log_format site '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" $request_time';
  access_log /dev/stdout site;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 10s;
  client_max_body_size 1k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css text/plain text/xml application/javascript application/json
             application/manifest+json application/xml image/svg+xml;

  # Cache: /_astro/ tem hash no nome do arquivo, então é imutável por 1 ano. Ícones e manifest: 1 dia.
  # Todo o resto (HTML, robots.txt, sitemap, llms.txt) revalida sempre por ETag/Last-Modified,
  # para que um deploy apareça na hora. Um único add_header no server evita a armadilha de herança
  # do nginx (add_header dentro de location descarta os headers de segurança do server).
  map $uri $cache_control {
    ~/_astro/                        "public, max-age=31536000, immutable";
    ~\.(?:ico|png|svg|webmanifest)$  "public, max-age=86400";
    default                          "no-cache";
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /srv/www;
    index index.html;
    autoindex off;
    # Location relativo em /cardapio -> /cardapio/ (funciona atrás de proxy e com a porta mapeada).
    absolute_redirect off;

    # Site estático: só leitura.
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;
    # Com TLS na frente (domínio próprio), ligue o HSTS. Só use includeSubDomains/preload depois de
    # confirmar HTTPS em todos os subdomínios de labellatorta.com.br — o preload é difícil de desfazer.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
      try_files $uri $uri/ =404;
    }

    # Arquivos ocultos (.nojekyll, .git…) nunca são servidos; /.well-known/ continua liberado.
    location ~ /\.(?!well-known/) {
      return 404;
    }

    # Pasta sem index (403) também vira 404: não revela o que existe no servidor.
    error_page 403 404 =404 /404.html;
    location = /404.html {
      internal;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
